<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090b0d" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=DM+Mono:wght@300;400;500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Pre-warm the two theme-flip clips in the background so clicking the
       toggle never has to cold-fetch+decode them for the first time right
       at the moment it needs to play - that initial fetch stall is a big
       part of why a first toggle can feel like it "sticks".
       NOTE: browsers don't actually support as="video" for link preload
       (even though it's technically a valid fetch destination in the spec) -
       as="fetch" is the standard workaround for preloading files that will
       be consumed by a <video> element. -->
  <link rel="preload" as="fetch" href="/video/transform-light-to-dark.mp4" type="video/mp4" crossorigin>
  <link rel="preload" as="fetch" href="/video/transform-dark-to-light.mp4" type="video/mp4" crossorigin>
  <title>VEXA — A Presence When You Need One</title>
  <link rel="icon" type="image/png" href="/vexa-icon.png" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
